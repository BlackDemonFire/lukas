version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directories:
      - "/.github/workflows"
      - "/.github/actions"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude:
        - "actions/*"